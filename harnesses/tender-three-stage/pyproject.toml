[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tender-three-stage-harness"
version = "0.1.0"
description = "Relocatable extract/semantic/fill tender response harness on the Foliorun SDK"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.13,<3", "python-docx==1.2.0", "lxml==6.1.3"]

[project.optional-dependencies]
live = ["foliorun[temporal,pydantic-ai-openai,opensandbox]==0.1.1.dev5", "httpx>=0.28,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]

[project.scripts]
tender-harness = "tender_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_harness"]

[tool.uv.sources]
foliorun = { path = "../..", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
