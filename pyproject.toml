[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foliorun"
version = "0.1.1.dev4"
description = "Durable host agents and disposable document tool sandboxes"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.13,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
temporal = ["temporalio==1.33.0"]
pydantic-ai = ["pydantic-ai-slim==2.61.0"]
pydantic-ai-openai = ["pydantic-ai-slim[openai]==2.61.0", "openai==3.51.0"]
opensandbox = ["opensandbox==0.1.16"]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/foliorun"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Only the public source and documented assets enter source distributions.
[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/uv.lock",
  "/src", "/tests", "/examples", "/image", "/skills", "/scripts",
  "/docs/operations.md", "/docs/migration.md", "/docs/model-errors.md",
  "/docs/tool-errors.md", "/docs/development.md",
]
